[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "showfzu-backend"
version = "0.1.0"
description = "FastAPI backend for the ShowFZU campus community."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.5",
  "fastapi>=0.116.1",
  "pillow>=11.3.0",
  "psycopg[binary]>=3.2.12",
  "pwdlib[argon2]>=0.2.1",
  "pydantic-settings>=2.11.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.44",
  "supabase>=2.24.0",
  "uvicorn[standard]>=0.38.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

